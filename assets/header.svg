<svg width="854" height="150" viewBox="0 0 854 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#BC8CFF"/>
      <stop offset="100%" stop-color="#39D353"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6EDF3"/>
    </linearGradient>
  </defs>

  <!-- Background Container -->
  <rect width="854" height="150" rx="12" fill="url(#bgGradient)"/>
  <rect x="0.5" y="0.5" width="853" height="149" rx="11.5" stroke="#30363d" stroke-opacity="0.8"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="854" height="3" rx="1.5" fill="url(#accentGradient)"/>

  <!-- Main Title -->
  <text x="50%" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="url(#textGradient)" letter-spacing="0.5">
    Luan Oliveira
  </text>

  <!-- Subtitle -->
  <text x="50%" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#58A6FF" letter-spacing="1.5">
    Tech Lead &amp; Software Architect
  </text>

  <!-- Bottom Accent Divider -->
  <line x1="327" y1="120" x2="527" y2="120" stroke="url(#accentGradient)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
</svg>
